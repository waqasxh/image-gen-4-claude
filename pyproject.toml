[project]
name = "google-image-gen-plugin"
version = "1.1.0"
description = "Claude Code plugin for generating images with Google's Gemini API"
requires-python = ">=3.10"
dependencies = [
    "google-genai>=1.0.0",
    "python-dotenv>=1.0.0",
    "pillow>=10.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]